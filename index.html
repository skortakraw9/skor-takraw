<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard Turnamen</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🏆 Dashboard Turnamen Takraw</h1>
<div id="container"></div>

<script type="module">
import { db, ref, onValue } from './firebase.js';

const container = document.getElementById("container");

for (let i = 1; i <= 5; i++) {
  const div = document.createElement("div");
  div.className = "lapangan";

  div.innerHTML = `
    <h2>Lapangan ${i}</h2>
    <h3 id="teamA${i}">Tim A</h3>
    <div id="A${i}" class="score">0</div>

    <h3 id="teamB${i}">Tim B</h3>
    <div id="B${i}" class="score">0</div>
  `;

  container.appendChild(div);

  onValue(ref(db, 'lapangan/' + i), (snap) => {
    let d = snap.val();
    if (d) {
      document.getElementById("A"+i).innerText = d.A;
      document.getElementById("B"+i).innerText = d.B;
      document.getElementById("teamA"+i).innerText = d.namaA || "Tim A";
      document.getElementById("teamB"+i).innerText = d.namaB || "Tim B";
    }
  });
}
</script>

</body>
</html>
