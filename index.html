<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Skor Sepak Takraw</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f2f2f2;
    }

    .container {
      background: white;
      padding: 20px;
      margin: 50px auto;
      width: 320px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .score {
      font-size: 70px;
      margin: 20px;
      font-weight: bold;
    }

    button {
      padding: 10px 18px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    h2 {
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Skor Sepak Takraw</h2>

  <h3>Tim A</h3>
  <div id="scoreA" class="score">0</div>
  <button onclick="tambahA()">+1 Tim A</button>

  <h3>Tim B</h3>
  <div id="scoreB" class="score">0</div>
  <button onclick="tambahB()">+1 Tim B</button>

  <br><br>

  <button onclick="resetSkor()">Reset</button>
  <button onclick="kirimHasil()">Kirim Hasil</button>
</div>

<script>
  let scoreA = 0;
  let scoreB = 0;

  function tambahA() {
    scoreA++;
    document.getElementById("scoreA").innerText = scoreA;
  }

  function tambahB() {
    scoreB++;
    document.getElementById("scoreB").innerText = scoreB;
  }

  function resetSkor() {
    scoreA = 0;
    scoreB = 0;
    document.getElementById("scoreA").innerText = 0;
    document.getElementById("scoreB").innerText = 0;
  }

  function kirimHasil() {
    let hasil = "Hasil Pertandingan:\nTim A: " + scoreA + "\nTim B: " + scoreB;
    alert(hasil);
  }
</script>

</body>
</html>
